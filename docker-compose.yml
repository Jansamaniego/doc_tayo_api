# Local development stack: API + PostgreSQL + a one-off migration job.
# Guide: docs/docker.md
#
#   docker compose up --build -d      # start postgres + api
#   docker compose run --rm migrate   # apply database migrations
#   docker compose down               # stop (database data is kept)
#   docker compose down -v            # stop AND DELETE the database volume
#
# Compose puts every service on one private network, where each service is
# reachable by its name (the API reaches the database at "postgres:5432").
# Only the ports listed under `ports:` are reachable from your machine.
#
# The api image is the same image you would deploy. Everything environment-
# specific comes from the `environment:` block, so in production you run the
# same image with a different DATABASE_URL (e.g. an AWS RDS endpoint).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      # Read by scripts/docker/postgres-init.sh on the first start only.
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-doctayo_owner_dev}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-doctayo_app_dev}
    ports:
      - '127.0.0.1:5434:5432' # host:container. 5434 stays clear of a host Postgres on 5432.
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives container removal
      - ./scripts/db:/scripts/db:ro
      - ./scripts/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    image: doc-tayo-api
    depends_on:
      postgres:
        condition: service_healthy # wait until Postgres answers
    ports:
      - '127.0.0.1:3000:3000' # reachable from this machine only
    environment:
      # The image defaults to production, which is strict (TLS to the DB, CORS
      # list, Observe keys). Local runs use development settings.
      NODE_ENV: development
      PORT: '3000'
      # "postgres" is the service name; Compose provides the DNS entry.
      # Credentials mirror DB_APP_PASSWORD above. Runtime role: DML only.
      DATABASE_URL: postgresql://doctayo_app:${DB_APP_PASSWORD:-doctayo_app_dev}@postgres:5432/doc_tayo
      DATABASE_SSL: disable # traffic stays on the private Docker network
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_FORMAT: json
      LOG_LEVEL: log
      SWAGGER_ENABLED: 'true'
      OBSERVE_ENABLED: 'false'
      # Development-only secret (never reuse outside this Compose file).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      MAIL_TRANSPORT: log
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}

  # One-off job (never runs on `up`): docker compose run --rm migrate
  # Uses the owner role, which the api service never receives.
  migrate:
    build:
      context: .
      target: migrate
    image: doc-tayo-migrate
    profiles: ['tools'] # not started by `up`; only by `run`
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: postgresql://doctayo_owner:${DB_OWNER_PASSWORD:-doctayo_owner_dev}@postgres:5432/doc_tayo

volumes:
  pgdata:
